<div class="demo-shell" dir="rtl">
    <header class="demo-shell__header">
        <a class="demo-shell__brand" routerLink="/forms">IMS Components</a>

        <nav class="demo-shell__nav" aria-label="ניווט בין דפי הדגמה">
            <div class="demo-shell__menu-bar" cdkMenuBar>
                @for (category of categories; track category.label) {
                    <button
                        type="button"
                        class="demo-shell__category"
                        [class.demo-shell__category--active]="category.active()"
                        cdkMenuItem
                        [cdkMenuTriggerFor]="categoryMenu"
                    >
                        {{ category.label }}
                        <ims-icon class="demo-shell__category-chevron" [size]="18">expand_more</ims-icon>
                    </button>

                    <ng-template #categoryMenu>
                        <div class="demo-shell__menu" cdkMenu>
                            @for (link of category.links; track link.path) {
                                <a
                                    class="demo-shell__menu-link"
                                    cdkMenuItem
                                    [routerLink]="link.path"
                                    routerLinkActive="demo-shell__menu-link--active"
                                    ariaCurrentWhenActive="page"
                                >
                                    {{ link.label }}
                                </a>
                            }
                        </div>
                    </ng-template>
                }
            </div>
        </nav>
    </header>

    <main class="demo-shell__content">
        <router-outlet/>
    </main>
</div>
