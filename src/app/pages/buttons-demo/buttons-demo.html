<header class="page-heading">
    <h1>כפתורים ואינטראקציות</h1>
    <p>הדגמות לפעולות בולטות ולחיצה ממושכת.</p>
</header>

<section class="button-demo">
    <div>
        <h2>כפתור קריאה לפעולה</h2>
        <p>שני גלים מדורגים מושכים תשומת לב לפעולה המרכזית בלי להזיז את הכפתור עצמו.</p>
    </div>

    <div class="button-demo__ims-buttons" aria-label="IMS button variants">
        <button ims-button>Default</button>
        <button ims-button ims-button-variation="primary">Primary</button>
        <button ims-button ims-button-variation="secondary">Secondary</button>
        <button ims-button ims-button-variation="outline">Outline</button>
        <button ims-button ims-button-variation="danger">Danger</button>
        <button ims-button ims-button-variation="primary">
            <ims-icon class="ims-button__symbol">add</ims-icon>
            Add
        </button>
        <button ims-button-icon aria-label="הוספה">
            <ims-icon>add</ims-icon>
        </button>
        <button ims-button disabled>Disabled</button>
        <button ims-button ims-button-variation="primary" disabled>Disabled</button>
        <button ims-button ims-button-variation="secondary" disabled>Disabled</button>
        <button ims-button ims-button-variation="outline" disabled>Disabled</button>
        <button ims-button ims-button-variation="danger" disabled>Disabled</button>
        <button ims-button-icon disabled aria-label="הוספה מושבתת">
            <ims-icon>add</ims-icon>
        </button>
        <button ims-button [ims-readonly]="true">Readonly</button>
    </div>

    <div class="button-demo__ims-buttons" aria-label="IMS call to action">
        <button ims-button call-to-action>Default</button>
        <button ims-button ims-button-variation="primary" call-to-action>
            המשך לתשלום
        </button>
        <button ims-button ims-button-variation="danger" call-to-action>Danger</button>
        <button ims-button-icon call-to-action aria-label="הוספה">
            <ims-icon>add</ims-icon>
        </button>
        <button ims-button ims-button-variation="primary" call-to-action disabled>Disabled</button>
    </div>
</section>

<section class="button-demo">
    <div>
        <h2>כפתור לחיצה ממושכת</h2>
        <p>הכפתור מפעיל את הפעולה רק אחרי החזקה של שנייה ושחרור לאחר שהטבעת התמלאה.</p>
    </div>

    <div class="long-press-demo__actions">
        <button
            type="button"
            class="critical-action-button"
            imsLongPress
            (click)="registerCriticalAction()"
        >
            פעולה קריטית
        </button>
        <span class="long-press-demo__count">הופעל {{ criticalActionCount }} פעמים</span>
    </div>
</section>
