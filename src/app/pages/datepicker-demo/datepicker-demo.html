<header class="page-heading">
    <h1>בורר תאריך</h1>
    <p>בחירה לפי יום או חודש, עם ערכי Luxon, Date ו-milliseconds.</p>
</header>

<section class="datepicker-demo">
    <div class="datepicker-demo__actions">
        <button type="button" (click)="tightenRange()">הגבל לשנת 2026</button>
        <button type="button" (click)="restoreRange()">החזר טווח 2020-2035</button>
        <button
            type="button"
            [attr.aria-pressed]="readonlyEnabled()"
            (click)="toggleReadonly()"
        >
            {{ readonlyEnabled() ? 'אפשר עריכת תאריך' : 'הפעל קריאה בלבד' }}
        </button>
    </div>

    <div class="datepicker-demo__grid">
        <label class="datepicker-demo__field">
            <span>תאריך מלא, Date, reactive form</span>
            <ims-datepicker
                ariaLabel="תאריך מלא"
                valueType="date"
                [formControl]="dateControl"
                [min]="min()"
                [max]="max()"
                showWeekNumbers
                (opened)="logDatepickerEvent('opened')"
                (closed)="logDatepickerEvent('closed')"
                (viewChanged)="logDatepickerEvent('viewChanged: ' + $event)"
                (dateChange)="logDatepickerEvent('dateChange', $event)"
            />
            <code>{{ describe(dateControl.value) }}</code>
            <code>{{ dateControl.errors | json }}</code>
            <code>{{ datepickerEvent() }}</code>
        </label>

        <label class="datepicker-demo__field">
            <span>תאריך לקריאה בלבד, ims-readonly</span>
            <ims-datepicker
                ariaLabel="תאריך לקריאה בלבד"
                valueType="date"
                [formControl]="readonlyDateControl"
                [ims-readonly]="readonlyEnabled()"
            />
            <code>{{ describe(readonlyDateControl.value) }}</code>
            <code>ims-readonly: {{ readonlyEnabled() }}</code>
        </label>

        <label class="datepicker-demo__field">
            <span>חודש, milliseconds, סוף חודש</span>
            <ims-datepicker
                format="MM/yyyy"
                monthDay="end"
                valueType="millis"
                ariaLabel="חודש"
                [formControl]="monthControl"
                [min]="min()"
                [max]="max()"
            />
            <code>{{ describe(monthControl.value) }}</code>
            <code>{{ monthControl.errors | json }}</code>
        </label>

        <label class="datepicker-demo__field">
            <span>ngModel עם פורמט תצוגה וניתוח מותאם</span>
            <ims-datepicker
                ariaLabel="תאריך בתבנית מותאמת"
                valueType="date"
                [(ngModel)]="templateDate"
                [formats]="customFormats"
            />
            <code>{{ describe(templateDate) }}</code>
        </label>

        <label class="datepicker-demo__field">
            <span>Luxon DateTime, reactive form</span>
            <ims-datepicker
                ariaLabel="Luxon date"
                valueType="luxon"
                [formControl]="luxonControl"
            />
            <code>{{ describe(luxonControl.value) }}</code>
            <code>{{ luxonControl.errors | json }}</code>
        </label>
    </div>
</section>
