@let data = item();

@if (data.routerLink && !data.disabled) {
    <a
        class="ims-dock-item__button"
        [routerLink]="data.routerLink"
        [attr.aria-label]="data.label"
        (focus)="onFocus($event)"
        (blur)="blurred.emit()"
        (click)="onActivate($event)"
    >
        <ims-duo-icon
            class="ims-dock-item__icon"
            [icon]="data.icon"
            [tone]="data.disabled ? 'muted' : (data.tone ?? null)"
        />
    </a>
} @else {
    <button
        type="button"
        class="ims-dock-item__button"
        [attr.aria-label]="data.label"
        [disabled]="data.disabled"
        (focus)="onFocus($event)"
        (blur)="blurred.emit()"
        (click)="onActivate($event)"
    >
        <ims-duo-icon
            class="ims-dock-item__icon"
            [icon]="data.icon"
            [tone]="data.disabled ? 'muted' : (data.tone ?? null)"
        />
    </button>
}

<span class="ims-dock-item__tooltip" role="tooltip">{{ data.label }}</span>
