<ims-dialog-content>
  <label class="ims-transfer-dialog__filter">
    <span class="ims-transfer-dialog__filter-label">סינון</span>
    <input
      imsInput
      class="ims-transfer-dialog__filter-input"
      type="search"
      autocomplete="off"
      [value]="filterQuery()"
      (input)="onFilterInput($event)"
    />
  </label>

  <div class="ims-transfer-dialog__lists">
    @for (list of listStates; track list.id) {
      <section class="ims-transfer-dialog__list-column">
        <header class="ims-transfer-dialog__list-header">
          <span class="ims-transfer-dialog__list-title" [imsTextTruncate]="list.title">{{
            list.title
          }}</span>
          <span class="ims-transfer-dialog__list-header-actions">
            <button
              ims-button-icon
              icon="sort"
              class="ims-transfer-dialog__header-action ims-transfer-dialog__header-action--sort"
              [class.ims-transfer-dialog__header-action--desc]="list.sort() === 'desc'"
              [class.ims-transfer-dialog__header-action--active]="list.sort() !== null"
              [attr.aria-label]="
                list.sort() === 'asc'
                  ? 'מיין בסדר יורד'
                  : list.sort() === 'desc'
                    ? 'נקה מיון'
                    : 'מיין בסדר עולה'
              "
              [attr.aria-pressed]="list.sort() !== null"
              [disabled]="list.rows().length < 2"
              (click)="toggleSort(list)"
            ></button>
            <span class="ims-transfer-dialog__count">{{ list.rows().length }}</span>
          </span>
        </header>

        <ims-scroll-container
          class="ims-transfer-dialog__list"
          [ariaLabel]="list.title"
          [hazeSize]="24"
          cdkDropList
          [cdkDropListSortingDisabled]="!!filterQuery().trim()"
          [id]="list.dropListId"
          [cdkDropListData]="list.filteredRows()"
          [cdkDropListConnectedTo]="list.connectedTo"
          (cdkDropListDropped)="drop($event, list)"
        >
          @for (row of list.filteredRows(); track row.id) {
            <div
              class="ims-transfer-dialog__row"
              [class.ims-transfer-dialog__row--disabled]="row.disabled"
              cdkDrag
              [cdkDragDisabled]="!!row.disabled"
              [cdkDragData]="row"
            >
              <span class="ims-icon ims-transfer-dialog__handle" aria-hidden="true">
                drag_indicator
              </span>
              <ims-checkbox
                class="ims-transfer-dialog__checkbox"
                [checked]="row.checked"
                [disabled]="!!row.disabled"
                (change)="toggleChecked(list, row)"
              >
                <span class="ims-transfer-dialog__checkbox-accessible-label">{{ row.label }}</span>
              </ims-checkbox>
              <span class="ims-transfer-dialog__label" [imsTextTruncate]="row.label">{{
                row.label
              }}</span>
            </div>
          } @empty {
            <p class="ims-transfer-dialog__empty">
              {{ filterQuery().trim() ? 'אין תוצאות' : 'אין פריטים' }}
            </p>
          }
        </ims-scroll-container>
      </section>
    }
  </div>
</ims-dialog-content>

<ims-dialog-actions class="ims-transfer-dialog__actions">
  <button ims-button ims-button-variation="secondary" (click)="reset()">אפס</button>
  <div class="ims-transfer-dialog__actions-group">
    <button ims-button (click)="cancel()">ביטול</button>
    <button ims-button ims-button-variation="primary" (click)="confirm()">אישור</button>
  </div>
</ims-dialog-actions>
