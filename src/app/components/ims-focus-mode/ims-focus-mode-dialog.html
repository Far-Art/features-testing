<ims-dialog-content>
  <div class="ims-focus-mode__stage" #stage>
    <ng-template [cdkPortalOutlet]="session.portal"/>
  </div>
</ims-dialog-content>

@let length = session.length();
@let maxLength = session.maxLength();

<ims-dialog-actions>
  <span class="ims-focus-mode__meta">
    @if (session.required()) {
      <span
        class="ims-focus-mode__required"
        [class.ims-focus-mode__required--unmet]="session.requiredUnmet()"
      >{{ session.labels.required }}</span>
    }

    <span
      class="ims-focus-mode__count"
      [class.ims-focus-mode__count--over]="maxLength !== null && length > maxLength"
    >
      @if (maxLength === null) {
        <span class="ims-focus-mode__count-value">{{ length }}</span>
        {{ session.labels.characters }}
      } @else {
        <span class="ims-focus-mode__count-value">{{ length }} / {{ maxLength }}</span>
      }
    </span>
  </span>

  <button ims-button (click)="cancel()">{{ session.labels.cancel }}</button>

  @if (session.editable()) {
    <button
      ims-button
      ims-button-variation="primary"
      [disabled]="!session.draftValid()"
      (click)="apply()"
    >
      {{ session.labels.apply }}
    </button>
  }
</ims-dialog-actions>
